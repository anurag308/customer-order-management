spring:
  application:
    name: customer-orders-api
  datasource:
    url: jdbc:h2:mem:customerorders;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

external-api:
  base-url: https://jsonplaceholder.typicode.com

logging:
  level:
    com.example.customerorders: INFO
    org.hibernate.SQL: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html